<title>Cuaderno de Baloncesto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#F5F8F8; --surface:#FFFFFF; --surface-2:#EDF3F2;
  --ink:#10201F; --ink-2:#3A4E4C; --muted:#5F7371;
  --line:#DBE5E4; --line-2:#C6D4D3;
  --accent:#0E7C7B; --accent-soft:#DCEDEC; --accent-ink:#0A5C5B; --on-accent:#FFFFFF;
  --sec:#8AB9B6;
  --good:#2E7D4F; --good-soft:#E1F0E7;
  --warn:#9C5A00; --warn-soft:#FBEDD9;
  --crit:#A82018; --crit-soft:#FBE5E3;
  --body:#CBD9D8; --figure:#10201F;
  --shadow:0 1px 2px rgba(16,32,31,.06),0 1px 8px rgba(16,32,31,.04);
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1413; --surface:#141F1E; --surface-2:#1B2726;
  --ink:#E4EEED; --ink-2:#B7C9C7; --muted:#8CA3A1;
  --line:#22312F; --line-2:#2F413F;
  --accent:#3FC9C2; --accent-soft:#12312F; --accent-ink:#7FDFD9; --on-accent:#06201E;
  --sec:#3E6D6A;
  --good:#5FC98A; --good-soft:#122C1E;
  --warn:#E0A64A; --warn-soft:#33260F;
  --crit:#F08A80; --crit-soft:#331714;
  --body:#2B3A38; --figure:#E4EEED;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 10px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0C1413; --surface:#141F1E; --surface-2:#1B2726;
  --ink:#E4EEED; --ink-2:#B7C9C7; --muted:#8CA3A1;
  --line:#22312F; --line-2:#2F413F;
  --accent:#3FC9C2; --accent-soft:#12312F; --accent-ink:#7FDFD9; --on-accent:#06201E;
  --sec:#3E6D6A;
  --good:#5FC98A; --good-soft:#122C1E;
  --warn:#E0A64A; --warn-soft:#33260F;
  --crit:#F08A80; --crit-soft:#331714;
  --body:#2B3A38; --figure:#E4EEED;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 10px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
img{max-width:100%}

/* ---------- ARMAZÓN ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px}
.logo{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:400}
.icon{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}
.icon:hover{border-color:var(--accent);color:var(--accent-ink)}

/* nav: abajo en móvil, en cabecera desde tablet */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;
  color:var(--muted);font-size:10.5px;font-weight:500;min-height:var(--nav-h)}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
main{flex:1;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}

@media (min-width:760px){
  nav{position:static;border-top:none;background:none;padding:0;gap:4px;flex:none}
  nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:8px 14px;
    border-radius:9px;min-height:0}
  nav button svg{width:17px;height:17px}
  nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
  main{padding-bottom:40px}
  .top{padding:11px 22px}
}

.wrap{max-width:1240px;margin:0 auto;padding:16px}
@media (min-width:760px){.wrap{padding:24px 22px}}
.view{display:none}
.view.on{display:block}

/* ---------- PIEZAS COMUNES ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden}
.card > h2{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:15px 16px 0}
.card .hint{font-size:12.5px;color:var(--muted);padding:3px 16px 0;max-width:62ch}
.card .body{padding:13px 16px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.card>h2,.card .hint{padding-left:18px;padding-right:18px}.card .body{padding:14px 18px 18px}.stack{gap:18px}}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:10.5px;font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date]{
  font-family:"IBM Plex Sans",sans-serif;font-size:16px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:9px;padding:10px 11px;width:100%}
input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
@media (min-width:760px){select,input{font-size:14px;padding:8px 10px}}

button.primary{margin-top:14px;width:100%;font-family:inherit;font-size:15px;font-weight:600;
  background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;padding:13px;cursor:pointer}
button.primary:active{filter:brightness(.94)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:13px;font-size:14px;
  color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;padding:2px 8px;border-radius:999px;margin-top:6px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}

.alert{border-radius:11px;padding:13px 15px;font-size:13.5px;line-height:1.5;background:var(--warn-soft);color:var(--warn)}
.alert.crit{background:var(--crit-soft);color:var(--crit)}
.alert b{display:block;font-family:Archivo,sans-serif;font-size:14px;margin-bottom:3px}

/* ---------- PROGRESO ---------- */
.objbar{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;
  box-shadow:var(--shadow);display:grid;gap:12px;grid-template-columns:1fr 1fr}
.objbar .full{grid-column:1/-1}
@media (min-width:760px){.objbar{grid-template-columns:1.4fr 1.4fr .7fr .8fr;align-items:end;padding:16px 18px}
  .objbar .full{grid-column:auto}}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
.tile .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:Archivo,sans-serif;font-size:27px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.1}
.tile .n{font-size:12px;color:var(--ink-2);margin-top:3px}
@media (min-width:760px){.tile .v{font-size:30px}}

.cols{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;align-items:start}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;margin-top:18px}}

form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px}
form .row + .row{margin-top:10px}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;padding:8px 9px;border-bottom:1px solid var(--line)}
td{padding:9px;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
tr:last-child td{border-bottom:none}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:4px 7px;border-radius:6px}
.del:hover{color:var(--crit);background:var(--crit-soft)}

.chart{width:100%;height:auto;display:block}
.chartnote{font-size:12px;color:var(--muted);margin-top:9px;max-width:62ch}
.tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--ink);
  color:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 9px;
  border-radius:6px;z-index:60;white-space:nowrap}
.logros{display:flex;flex-direction:column;gap:9px}
.logro{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line)}
.logro.on{background:var(--good-soft);border-color:transparent}
.logro .mk{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;flex:none;
  width:20px;text-align:center;color:var(--muted)}
.logro.on .mk{color:var(--good)}
.logro .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.logro .d{font-size:12.5px;color:var(--ink-2)}
textarea{width:100%;min-height:100px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);border-radius:9px;padding:10px;resize:vertical}

/* ---------- EJERCICIOS ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
@media (min-width:900px){.filters{flex-wrap:wrap;overflow:visible}}
.chip{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.exlayout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.exlayout{grid-template-columns:270px minmax(0,1fr);gap:18px}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden}
@media (min-width:900px){.list{max-height:76vh;overflow-y:auto;position:sticky;top:88px}}
.li{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);padding:13px 15px;cursor:pointer;font-family:inherit;
  font-size:14.5px;color:var(--ink-2)}
.li:last-child{border-bottom:none}
.li[aria-current=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.li .id{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);flex:none;width:50px}
.li[aria-current=true] .id{color:var(--accent-ink)}
.backbtn{display:none;align-items:center;gap:7px;background:none;border:none;color:var(--accent-ink);
  font-family:inherit;font-size:14px;font-weight:600;padding:0 0 12px;cursor:pointer}
@media (max-width:899px){
  .exlayout.detail .list,.exlayout.detail .filters{display:none}
  .exlayout.detail .backbtn{display:flex}
  .exlayout:not(.detail) .detailcol{display:none}
}

.detail{display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.detail{gap:18px}}
.hero{padding:16px}
.hero .name{font-family:Archivo,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
@media (min-width:760px){.hero .name{font-size:22px}.hero{padding:18px}}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.no{background:var(--good-soft);color:var(--good);border-color:transparent}

.visuals{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}
@media (min-width:560px){.visuals{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.visuals.three{grid-template-columns:1fr 1fr 1fr}}
.panel{background:var(--surface-2);border-radius:11px;padding:12px}
.panel h3{font-size:10.5px;font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:7px}
.ph{position:relative;border-radius:9px;overflow:hidden;background:var(--surface);aspect-ratio:4/3}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph img:nth-child(2){animation:swap 2.2s steps(1,end) infinite}
.ph.paused img{animation:none}
@keyframes swap{0%,50%{opacity:0}50.01%,100%{opacity:1}}
.src{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.src a{color:var(--accent-ink)}
.src b{color:var(--ink-2)}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ctrl button{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface);
  border:1px solid var(--line-2);color:var(--ink-2);border-radius:7px;padding:6px 12px;cursor:pointer}
.viewtabs{display:flex;gap:6px;margin-bottom:8px}
.viewtabs button{flex:1;font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface);
  border:1px solid var(--line-2);color:var(--muted);border-radius:7px;padding:7px 8px;cursor:pointer}
.viewtabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
svg.viz{width:100%;height:auto;display:block}

ol.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--ink-2)}
ol.cues strong{color:var(--ink)}
ul.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.errs li{display:flex;gap:10px;font-size:14.5px;color:var(--ink-2)}
ul.errs .x{color:var(--crit);font-weight:700;flex:none;font-family:"IBM Plex Mono",monospace}
ul.errs b{color:var(--ink);font-weight:600}
.prog{display:grid;grid-template-columns:1fr;gap:11px}
@media (min-width:560px){.prog{grid-template-columns:1fr 1fr}}
.prog div{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.prog .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prog .t{font-size:14px;color:var(--ink-2);margin-top:3px}
.empty{color:var(--muted);font-size:13.5px;padding:16px 0;text-align:center}

/* ---------- HOY ---------- */
.hoy-head{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 16px;
  box-shadow:var(--shadow)}
.hoy-head .obj{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.hoy-head h2{font-size:clamp(20px,5vw,26px);font-weight:700;letter-spacing:-.02em;margin-top:5px}
.hoy-head p{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:60ch}
.blocks{display:grid;grid-template-columns:1fr;gap:11px;margin-top:14px}
@media (min-width:640px){.blocks{grid-template-columns:1fr 1fr}}
@media (min-width:1060px){.blocks{grid-template-columns:repeat(4,1fr)}}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:var(--shadow)}
.blk .pc{font-family:Archivo,sans-serif;font-size:23px;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.blk .nm{font-size:14px;font-weight:600;margin-top:2px}
.blk .ex{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.blk .ex button{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-2);border-radius:6px;padding:4px 8px;cursor:pointer}
.blk .ex button:hover{border-color:var(--accent);color:var(--accent-ink)}
.nope{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:9px;padding:11px 13px;margin-top:12px}

footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;
  color:var(--muted);max-width:78ch}
footer p{margin:0 0 9px}
footer strong{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.fig animate,.fig animateTransform{display:none}.ph img{animation:none}}
.fig.paused animate,.fig.paused animateTransform{display:none}
</style>

<div class="app">
<header class="top">
  <div class="logo">Cuaderno de baloncesto<small>Preparación física y nutrición</small></div>
  <nav id="nav" aria-label="Secciones"></nav>
  <button class="icon" id="theme" aria-label="Cambiar tema" title="Cambiar tema">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
    </svg></button>
</header>

<main>
  <div class="wrap">
    <section class="view on" id="v-hoy"></section>
    <section class="view" id="v-ejercicios"></section>
    <section class="view" id="v-progreso"></section>
    <footer id="foot"></footer>
  </div>
</main>
</div>
<div class="tip" id="tip"></div>
